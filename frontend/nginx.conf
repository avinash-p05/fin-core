# This file is included inside nginx's http {} block, so zones can be declared here.

# Behind Caddy (and Docker networking) the TCP peer is a private address. Take the client IP from
# X-Forwarded-For, trusting only private-network proxies, so per-IP limits apply to real users.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Per-IP API rate limit: 20 requests/second sustained, short bursts up to 40 allowed.
limit_req_zone $binary_remote_addr zone=fincore_api:10m rate=20r/s;
limit_req_status 429;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin API access: the browser calls /api, nginx forwards to the backend container.
    location /api/ {
        limit_req zone=fincore_api burst=40 nodelay;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Client-side routes (React Router) fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
