spring:
  application:
    name: fincore
  datasource:
    url: ${FINCORE_DB_URL:jdbc:postgresql://localhost:5432/fincore}
    username: ${FINCORE_DB_USER:fincore}
    password: ${FINCORE_DB_PASSWORD:fincore}
    hikari:
      maximum-pool-size: ${FINCORE_DB_POOL_SIZE:20}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_updates: true
        order_inserts: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${FINCORE_REDIS_HOST:localhost}
      port: ${FINCORE_REDIS_PORT:6379}
      # Fail fast: a Redis outage must not hang payment requests (see fraud failure policy).
      timeout: 500ms
      connect-timeout: 500ms
  kafka:
    bootstrap-servers: ${FINCORE_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        # Bounded blocking so a Kafka outage cannot stall the outbox publisher for minutes.
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
    consumer:
      group-id: fincore-notifications
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      # Commit the offset after each record has been processed (and its DB transaction committed).
      ack-mode: record
      # One consumer thread per partition of fincore.payment-events (3 partitions).
      concurrency: 3

server:
  port: ${FINCORE_PORT:8080}
  # Trust X-Forwarded-For from internal proxies (Caddy, nginx) so request.getRemoteAddr() is the real
  # client IP. Tomcat only trusts private-network addresses, so clients cannot spoof it.
  forward-headers-strategy: native
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

fincore:
  demo:
    seed: ${FINCORE_DEMO_SEED:false}
  kafka:
    payment-events-topic: fincore.payment-events
  outbox:
    publisher-enabled: ${FINCORE_OUTBOX_PUBLISHER_ENABLED:true}
    poll-interval: 1s
    batch-size: 200
    max-attempts: 10
    initial-backoff: 1s
    max-backoff: 5m
    send-timeout: 10s
  consumer:
    enabled: ${FINCORE_CONSUMER_ENABLED:true}
    max-retries: 3
    retry-backoff: 500ms
  fraud:
    review-threshold: 40      # score >= 40 -> REVIEW
    decline-threshold: 70     # score >= 70 -> DECLINED
    high-value:
      enabled: true
      threshold: 100000.00    # INR
      score: 50
    velocity:
      enabled: true
      max-transactions: 5     # per source account per window; the (max+1)th attempt triggers
      window: 60s
      score: 40
      # What to do when Redis is unavailable. Never APPROVE silently: REVIEW or DECLINE.
      unavailable-decision: REVIEW
    new-beneficiary:
      enabled: true
      score: 20
  security:
    # Local-development users only. Override via environment variables; see README.
    operator-username: ${FINCORE_OPERATOR_USER:operator}
    operator-password: ${FINCORE_OPERATOR_PASSWORD:operator-dev-password}
    analyst-username: ${FINCORE_ANALYST_USER:analyst}
    analyst-password: ${FINCORE_ANALYST_PASSWORD:analyst-dev-password}
    allowed-origins: ${FINCORE_ALLOWED_ORIGINS:http://localhost:5173}
    bcrypt-strength: ${FINCORE_BCRYPT_STRENGTH:10}
    login-max-failures: ${FINCORE_LOGIN_MAX_FAILURES:10}
    login-failure-window: 15m
