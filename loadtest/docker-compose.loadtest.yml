# Load-test override: relaxes the velocity LIMIT so settled transfers can be measured.
# The velocity rule still runs (one Redis round trip per payment); only the threshold changes.
services:
  backend:
    environment:
      FINCORE_FRAUD_VELOCITY_MAXTRANSACTIONS: "1000000"
      FINCORE_DEMO_SEED: "false"
      # k6 sends ~1,000 requests/s from one IP; lift the per-IP API limit for the benchmark.
      FINCORE_API_REQUESTS_PER_SECOND: "1000000"
      # Only for the "payment path" run: cheaper password hashing (default 10). See loadtest/RESULTS.md.
      FINCORE_BCRYPT_STRENGTH: ${FINCORE_BCRYPT_STRENGTH:-10}
