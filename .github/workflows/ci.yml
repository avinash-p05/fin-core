# CI/CD for FinCore.
#   every push / PR:  run the backend test suite (Testcontainers: real PostgreSQL, Redis, Kafka)
#   push to main:     build the single FinCore image (backend/Dockerfile) and push it to
#                     ghcr.io/avinash-p05/fin-core with two tags: latest and the commit SHA
#
# The server never builds. It only pulls the image:
#   cd ~/fincore && ./deploy.sh          # docker compose pull && docker compose up -d
# Roll back: set FINCORE_IMAGE_TAG=<older sha> in ~/fincore/.env and run ./deploy.sh again.
name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".archify/**"
      - "loadtest/**"
      - ".github/workflows/architecture-pages.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/avinash-p05/fin-core

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Backend tests
        working-directory: backend
        run: ./mvnw -B -ntp verify

  image:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # Repository root: the image also builds the React dashboard.
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # Reuse npm / Maven layers between runs.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "Pushed \`${IMAGE}:latest\` and \`${IMAGE}:${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Deploy on the server: \`cd ~/fincore && ./deploy.sh\`" >> "$GITHUB_STEP_SUMMARY"
