# FinCore public demo stack (single VPS). Simulated money only; never point this at real bank systems.
#
# Only Caddy is reachable from the internet (ports 80/443, automatic HTTPS). Postgres, Redis, Kafka
# and the backend stay on the internal Docker network. Secrets come from infrastructure/.env.prod.
#
#   docker compose -f infrastructure/docker-compose.prod.yml --env-file infrastructure/.env.prod up -d --build

name: fincore

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fincore
      POSTGRES_USER: fincore
      POSTGRES_PASSWORD: ${FINCORE_DB_PASSWORD:?set FINCORE_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fincore -d fincore"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "96mb", "--maxmemory-policy", "allkeys-lru"]
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.8.1
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
      # Keep the demo's disk use bounded.
      KAFKA_LOG_RETENTION_HOURS: 72
    mem_limit: 900m
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  backend:
    build:
      context: ../backend
    restart: unless-stopped
    environment:
      FINCORE_DB_URL: jdbc:postgresql://postgres:5432/fincore
      FINCORE_DB_USER: fincore
      FINCORE_DB_PASSWORD: ${FINCORE_DB_PASSWORD}
      FINCORE_DB_POOL_SIZE: 10
      FINCORE_REDIS_HOST: redis
      FINCORE_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      FINCORE_DEMO_SEED: "true"
      FINCORE_ALLOWED_ORIGINS: https://${FINCORE_DOMAIN:?set FINCORE_DOMAIN}
      FINCORE_OPERATOR_PASSWORD: ${FINCORE_OPERATOR_PASSWORD:?set FINCORE_OPERATOR_PASSWORD}
      FINCORE_ANALYST_PASSWORD: ${FINCORE_ANALYST_PASSWORD:?set FINCORE_ANALYST_PASSWORD}
    # The Dockerfile sizes the heap at 75% of this limit (~768 MB).
    mem_limit: 1g
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 30

  frontend:
    build:
      context: ../frontend
    restart: unless-stopped
    mem_limit: 64m
    depends_on:
      backend:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      FINCORE_DOMAIN: ${FINCORE_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    mem_limit: 128m
    depends_on:
      - frontend

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
