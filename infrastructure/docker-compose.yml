# FinCore local stack. Simulated money only; never point this at real bank systems.
#
#   Infrastructure only (run the backend from your IDE / ./mvnw):
#     docker compose -f infrastructure/docker-compose.yml up -d postgres redis kafka
#   Everything (backend + dashboard at http://localhost:3000):
#     docker compose -f infrastructure/docker-compose.yml up -d --build

name: fincore

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fincore
      POSTGRES_USER: fincore
      POSTGRES_PASSWORD: fincore
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fincore -d fincore"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.8.1
    ports:
      # Host clients (a backend started outside Docker) use localhost:9094.
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  backend:
    build:
      context: ../backend
    environment:
      FINCORE_DB_URL: jdbc:postgresql://postgres:5432/fincore
      FINCORE_DB_USER: fincore
      FINCORE_DB_PASSWORD: fincore
      FINCORE_REDIS_HOST: redis
      FINCORE_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      FINCORE_DEMO_SEED: "true"
      FINCORE_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
      # Dev-only credentials; override for anything shared.
      FINCORE_OPERATOR_PASSWORD: ${FINCORE_OPERATOR_PASSWORD:-operator-dev-password}
      FINCORE_ANALYST_PASSWORD: ${FINCORE_ANALYST_PASSWORD:-analyst-dev-password}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 30

  frontend:
    build:
      context: ../frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
